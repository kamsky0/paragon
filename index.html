<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mój Paragon</title>
<meta name="theme-color" content="#6D3FD1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F2F0F7;--surface:#FFFFFF;--ink:#1D1828;--muted:#6C6680;--line:#E1DDEB;--soft:#F7F5FB;
  --accent:#6D3FD1;--accent-ink:#FFFFFF;--accent-soft:#ECE5FB;--warn:#B7791F;--bad:#C2410C;
  --c-jedzenie:#3B8E6E;--c-przekaski:#D45B8A;--c-napoje:#3D7CC9;--c-miasto:#E07A3F;--c-transport:#2BA3A8;--c-rachunki:#4F7A8C;
  --c-rozrywka:#C9A227;--c-ubrania:#B4544A;--c-uroda:#7E9A3A;--c-dom:#8C6D52;--c-prezenty:#6F79D9;--c-inne:#8A8F8C;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px;--shadow:0 1px 2px rgba(29,24,40,.06),0 8px 24px rgba(29,24,40,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#110E18;--surface:#1A1623;--ink:#ECE8F4;--muted:#9A93AD;--line:#2E283B;--soft:#211C2C;
  --accent:#A98BF5;--accent-ink:#160F26;--accent-soft:#2E2448;--warn:#E3B04B;--bad:#F07A4A;
  --c-jedzenie:#55B48F;--c-przekaski:#E87DA6;--c-napoje:#6AA0E6;--c-miasto:#F0935A;--c-transport:#4CC3C7;--c-rachunki:#79A7BA;
  --c-rozrywka:#DDBB45;--c-ubrania:#D2766C;--c-uroda:#A4C05A;--c-dom:#B08F72;--c-prezenty:#939BEB;--c-inne:#9AA19D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 110px);display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:transform .15s}
.icon-btn:active{transform:scale(.92)}
.icon-btn:disabled{opacity:.35;cursor:default}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar span{font-weight:600;font-size:17px;text-transform:capitalize}
.view{display:flex;flex-direction:column;gap:16px}
.receipt{position:relative;background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:22px 20px 18px;box-shadow:var(--shadow);margin-bottom:10px}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:12px;background:linear-gradient(135deg,var(--surface) 33%,transparent 33.5%) 0 0/14px 12px repeat-x,linear-gradient(225deg,var(--surface) 33%,transparent 33.5%) 0 0/14px 12px repeat-x}
.r-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.total{font-family:var(--f-display);font-weight:700;font-size:clamp(42px,13vw,58px);letter-spacing:-.03em;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.total small{font-size:.42em;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);width:0;transition:width .8s cubic-bezier(.2,.8,.2,1),background .3s}
.pace{margin-top:10px;color:var(--muted);font-size:15px}
.pace b{color:var(--ink);font-weight:600}
.dash{border-top:1px dashed var(--line);margin:14px 0 10px}
.mini{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.mini b{color:var(--ink);font-weight:600;font-family:var(--f-mono);font-size:13px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;border:1px solid var(--line)}
.card h2{font-family:var(--f-display);font-weight:500;font-size:18px;margin:0 0 4px;text-wrap:balance}
.card .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.donut-row{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:start}
@media (max-width:360px){.donut-row{grid-template-columns:1fr}.donut-row svg{margin:0 auto}}
.donut circle{transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1)}
.cats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.cats li{display:grid;grid-template-columns:10px 1fr auto;gap:4px 10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.cats .name{min-width:0;font-size:15px;line-height:1.25}
.amt,.mono{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.cats .lim{grid-column:2/4;height:4px;border-radius:99px;background:var(--soft);overflow:hidden}
.cats .lim i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.cats .note{grid-column:2/4;font-size:12px;color:var(--muted);margin-top:-4px}
.shops{display:flex;flex-direction:column;gap:16px}
.shop-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.shop-head b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--soft);margin:6px 0 4px;gap:2px}
.stack-bar i{display:block;height:100%;transition:flex-grow .8s cubic-bezier(.2,.8,.2,1)}
.shop-note{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.shop-note span{display:inline-flex;align-items:center;gap:5px}
.shop-note .dot{width:8px;height:8px}
svg text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:15px}
.day h3{font-size:12px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:400;margin:16px 0 4px;display:flex;justify-content:space-between;gap:8px}
.day:first-child h3{margin-top:0}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.day .row:last-child{border-bottom:0}
.row .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .m{grid-column:1;font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .a{font-family:var(--f-mono);font-variant-numeric:tabular-nums;grid-row:1/3;grid-column:2;text-align:right}
.row .a small{display:block;font-size:11px;font-weight:600}
.row .a.inc{color:var(--accent);font-weight:600}
.row .sb{grid-column:1/3;display:flex;height:4px;border-radius:99px;overflow:hidden;gap:2px;margin-top:6px}
.row .sb i{display:block;height:100%}
.row .x{grid-column:1/3;display:flex;flex-direction:column;gap:8px;margin-top:10px;cursor:default}
.row .x .lines{display:flex;flex-direction:column;gap:4px;font-size:14px}
.row .x .ln{display:flex;justify-content:space-between;gap:10px}
.row .x .ln span:first-child{display:inline-flex;align-items:center;gap:8px}
.row .x .btns{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:10px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;color:var(--muted);vertical-align:2px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);transition:transform .12s,opacity .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl-s{font-size:13px;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:11px 12px;width:100%;min-width:0;font-size:16px}
.budget-grid{display:grid;grid-template-columns:1fr 120px;gap:10px 12px;align-items:center}
.budget-grid .lbl{display:flex;align-items:center;gap:10px;min-width:0}
.budget-grid .input{text-align:right;font-family:var(--f-mono)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none;padding:4px 0}
details summary::-webkit-details-marker{display:none}
details[open] summary{margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;padding:9px 0;border-radius:9px;color:var(--muted);font-weight:500;font-size:15px;transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:14px;color:var(--ink);transition:transform .12s,background .2s,color .2s,border-color .2s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:64px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:8px 0 10px;transition:color .2s}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.nav button svg{transition:transform .25s}
.nav button[aria-current="page"] svg{transform:translateY(-1px) scale(1.08)}
.nav .plus{align-self:center;justify-self:center;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;padding:0;transform:translateY(-14px);box-shadow:0 10px 26px rgba(109,63,209,.4);transition:transform .15s}
.nav .plus:active{transform:translateY(-14px) scale(.93)}
.scrim{position:fixed;inset:0;background:rgba(17,12,28,.5);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:22px 22px 0 0;padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.2,1),visibility 0s linear .32s;max-height:94%;overflow-y:auto;overscroll-behavior:contain}
.sheet.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.2,1)}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 2px}
.amount{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding-bottom:4px;transition:border-color .2s}
.amount:focus-within{border-color:var(--accent)}
.amount input{border:0;background:none;outline:none;font-family:var(--f-display);font-weight:700;font-size:46px;letter-spacing:-.02em;width:100%;min-width:0;padding:0}
.amount span{font-family:var(--f-mono);color:var(--muted);font-size:18px}
.catpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.catpick button{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 6px;font-size:13px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s,border-color .2s,background .2s;min-height:60px;justify-content:center}
.catpick button:active{transform:scale(.95)}
.catpick button[aria-checked="true"]{border-color:var(--ink);background:var(--surface);font-weight:600}
.split{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.part{display:grid;grid-template-columns:1fr 104px 36px;gap:8px;align-items:center;animation:in .3s cubic-bezier(.2,.9,.3,1)}
.part select,.part input{background:var(--surface)}
.part input{text-align:right;font-family:var(--f-mono)}
.part .rm{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.rest{font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.rest b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.rest.bad b{color:var(--bad)}
.add-part{border:1px dashed var(--accent);color:var(--accent);background:none;border-radius:12px;padding:11px;font-weight:600;transition:background .2s}
.add-part:active{background:var(--accent-soft)}
.scan-btn{display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.fav-hint{font-size:12px;color:var(--muted)}
.chip.fav{border-style:dashed}
.pz{display:grid;grid-template-columns:1fr 96px 36px;gap:6px 8px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line);animation:in .3s cubic-bezier(.2,.9,.3,1) both}
.pz:last-of-type{border-bottom:0}
.pz-n{grid-column:1/4;font-size:14px;font-weight:500;overflow-wrap:anywhere}
.pz select,.pz input{background:var(--surface);padding:9px 10px}
.pz select{border-left-width:4px}
.pz input{text-align:right;font-family:var(--f-mono)}
.pz .rm{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.ok{color:var(--accent)}
.row .x .pos-list{display:flex;flex-direction:column;gap:3px;font-size:13px}
.row .x .pos-list .ln span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(18px)}
.hist{display:flex;flex-direction:column}
.h-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.h-row:last-child{border-bottom:0}
.h-row.h3{grid-template-columns:auto 1fr auto}
.h-row .d{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.x-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:32px;height:30px;padding:0 8px;font-size:13px;color:var(--muted)}
.x-btn.on{background:var(--bad);border-color:var(--bad);color:#fff}
.movform{padding:14px;background:var(--soft);border-radius:12px;border:1px solid var(--line);margin:4px 0 8px}
.movform .input{background:var(--surface)}
.pos{color:var(--accent)}.neg{color:var(--bad)}.stale{color:var(--warn)}
.notice{font-size:14px;color:var(--muted);background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice.warn{background:var(--soft);border:1px dashed var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s,transform .25s;z-index:40;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.view>*{animation:in .35s cubic-bezier(.2,.9,.3,1) both}
.view>*:nth-child(2){animation-delay:.04s}.view>*:nth-child(3){animation-delay:.08s}.view>*:nth-child(4){animation-delay:.12s}.view>*:nth-child(5){animation-delay:.16s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand" id="viewTitle">Mój Paragon</div>
    <button class="icon-btn" id="gear" aria-label="Ustawienia"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
  </header>

  <div class="monthbar" id="monthbar">
    <button class="icon-btn" id="prev" aria-label="Poprzedni miesiąc"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span id="monthName"></span>
    <button class="icon-btn" id="next" aria-label="Następny miesiąc"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="m6 3 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <main id="main"></main>
</div>

<script>
const BASE=[["jedzenie","Jedzenie"],["przekaski","Słodycze i przekąski"],["napoje","Napoje i energetyki"],["miasto","Na mieście"],["transport","Transport"],["rachunki","Rachunki"],["rozrywka","Rozrywka"],["ubrania","Ubrania"],["uroda","Kosmetyki i zdrowie"],["dom","Chemia i dom"],["prezenty","Prezenty"],["inne","Inne"]].map(([id,n])=>({id,n}));
const INC=[["wyplata","Wypłata"],["stypendium","Stypendium"],["rodzina","Od rodziny"],["zwrot","Zwrot pieniędzy"],["inneplus","Inne wpływy"]].map(([id,n])=>({id,n}));
const ITYPES=[["etf","ETF / fundusz"],["akcje","Akcje"],["obligacje","Obligacje skarbowe"],["lokata","Lokata / oszczędnościowe"],["krypto","Krypto"],["inne","Inne"]].map(([id,n])=>({id,n}));
const itCol={etf:"var(--accent)",akcje:"var(--c-napoje)",obligacje:"var(--c-jedzenie)",lokata:"var(--c-rozrywka)",krypto:"var(--c-miasto)",inne:"var(--c-inne)"};
const PAL=["#5E9C8F","#C77D4F","#7A86B8","#B86E8A","#8FA35A","#A88A5C","#4F95B5","#C0646B"];
const MOVN={wplata:"Wpłata",wycena:"Wartość konta",wyplata:"Wypłata"};
const QUICK=["Netflix","Spotify","Discord Nitro","YouTube Premium","Disney+","Max","Amazon Prime","iCloud+","Google One","Xbox Game Pass","PlayStation Plus"];
const STORE="moj-paragon-v1";

const $=s=>document.querySelector(s);
const zl=new Intl.NumberFormat("pl-PL",{style:"currency",currency:"PLN"});
const num=new Intl.NumberFormat("pl-PL",{minimumFractionDigits:2,maximumFractionDigits:2});
const compact=new Intl.NumberFormat("pl-PL",{notation:"compact",maximumFractionDigits:1});
const fmt=g=>zl.format(g/100);
const signed=g=>`${g<0?"":"+"}${fmt(g)}`;
const pct=v=>`${v<0?"":"+"}${(v*100).toFixed(1).replace(".",",")}%`;
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ym=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const today=()=>ymd(new Date());
const parseG=s=>{const v=parseFloat(String(s||"").replace(/\s/g,"").replace(",","."));return isFinite(v)&&v>0?Math.round(v*100):0};
const toInput=g=>g?num.format(g/100).replace(/\s/g,""):"";
const daysIn=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m,0).getDate()};
const shiftMonth=(k,d)=>{const[y,m]=k.split("-").map(Number);return ym(new Date(y,m-1+d,1))};
const endOf=k=>`${k}-${pad(daysIn(k))}`;
const monthLabel=(k,o)=>{const[y,m]=k.split("-").map(Number);return new Intl.DateTimeFormat("pl-PL",o).format(new Date(y,m-1,1))};
const shortDate=d=>{const[y,m,dd]=d.split("-").map(Number);return new Intl.DateTimeFormat("pl-PL",{day:"numeric",month:"short"}).format(new Date(y,m-1,dd))};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sum=l=>l.reduce((a,e)=>a+(e.kwota||0),0);
const plural=(n,a,b,c)=>n===1?a:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?b:c;

const DEFAULT_FAV=[{id:"f1",n:"Energetyk",kat:"napoje",kwota:0},{id:"f2",n:"Słodycze",kat:"przekaski",kwota:0},{id:"f3",n:"Kawa",kat:"miasto",kwota:0},{id:"f4",n:"Kebab",kat:"miasto",kwota:0}];
const EMPTY=()=>({v:1,items:[],subs:[],acc:[],mov:[],budget:{limit:0,kat:{}},cats:[],fav:DEFAULT_FAV.map(f=>({...f})),learn:{},lastBackup:null});
const SHOPS=[["BIEDRONKA","Biedronka"],["JERONIMO","Biedronka"],["LIDL","Lidl"],["AUCHAN","Auchan"],["ŻABKA","Żabka"],["ZABKA","Żabka"],["KAUFLAND","Kaufland"],["CARREFOUR","Carrefour"],["DINO","Dino"],["NETTO","Netto"],["TWÓJ MARKET","Twój Market"],["TWOJ MARKET","Twój Market"],["ROSSMANN","Rossmann"],["HEBE","Hebe"],["PEPCO","Pepco"],["ACTION","Action"],["STOKROTKA","Stokrotka"],["LEWIATAN","Lewiatan"],["POLOMARKET","POLOmarket"],["ALDI","Aldi"],["INTERMARCHE","Intermarché"],["SPAR","Spar"],["DELIKATESY CENTRUM","Delikatesy Centrum"],["MCDONALD","McDonald's"],["KFC","KFC"],["STARBUCKS","Starbucks"],["COSTA","Costa Coffee"],["ORLEN","Orlen"]];
const RULES=[
  ["napoje",/ENERG|TIGER|MONSTER|RED ?BULL|BLACK ENERGY|\bBURN\b|DZIK|COCA|\bCOLA\b|PEPSI|SPRITE|FANTA|MIRINDA|7 ?UP|OSHEE|WODA|\bSOK\b|NEKTAR|NAP[OÓ]J|\bNAP\b|NAP\.|LIPTON|ICE ?TEA|PIWO|LECH|TYSKIE|[ŻZ]UBR|HERBATA|KAWA|LATTE|CAPPUCC|ESPRESSO|SCHWEPPES|TONIC|KUBUŚ|TYMBARK|HELL|LEMONIAD/],
  ["przekaski",/CZEKOL|BATON|SNICKERS|\bMARS\b|TWIX|BOUNTY|KINDER|PRINCE|GOFRY|CHIPS|CHRUP|LAY'?S|PRINGLES|CHEETOS|CRUNCHIPS|PALUSZ|PRECL|[ŻZ]ELK|HARIBO|CUKIERK|LIZAK|GUMA DO|ORBIT|CIASTK|CIASTO|WAFEL|WAFL|DONUT|P[AĄ]CZ|ROGAL 7|LODY|\bL[OÓ]D\b|M&M|DRA[ŻZ]|MILKA|WEDEL|OREO|DELICJE|PIERNIK|NACHOS|POPCORN|ORZESZK/],
  ["dom",/PAPIER|R[EĘ]CZNIK|DOMESTOS|P[ŁL]YN|PROSZEK|KAPSU[ŁL]K|WOREK|WORKI|G[AĄ]BK|FOLIA|ZMYWAK|\bCIF\b|FAIRY|VANISH|LENOR|PERSIL|ARIEL|BATERI|[ŻZ]AR[OÓ]WK|CHUSTECZ|TABLETKI DO ZMYW|ODŚWIE[ŻZ]/],
  ["uroda",/SZAMP|[ŻZ]EL POD|[ŻZ]EL D\/|PASTA DO Z|SZCZOTEC|DEZOD|ANTYPER|KREM|BALSAM|MYD[ŁL]O|PODPAS|TAMPON|WATA|PATYCZ|MASZYNK|LAKIER|POMADK|TUSZ|PIANKA DO|ODŻYWK|IBUPROM|APAP|PARACET|WITAMIN|PLASTR/],
  ["inne",/REKLAMOW|\bTORBA\b|TORBY|KAUCJA|OP\.ZWR|OPAKOWANIE ZWR/]
];
function load(){try{const s=JSON.parse(localStorage.getItem(STORE)||"null");if(s&&s.v===1)return{...EMPTY(),...s}}catch(e){}return EMPTY()}
let D=load();
function save(){try{localStorage.setItem(STORE,JSON.stringify(D));return true}catch(e){toast("Nie udało się zapisać danych w telefonie");return false}}

const S={scan:null,view:"miesiac",month:ym(new Date()),open:null,confirm:null,typ:"wydatek",kat:"jedzenie",inc:"wyplata",parts:[],editId:null,openAcc:null,movR:"wplata",confirmMov:null,confirmAcc:false,openSub:null,confirmSub:null,pendingImport:null,animate:true,shown:{}};

const cats=()=>[...BASE,...D.cats];
const catOf=id=>cats().find(c=>c.id===id)||BASE[BASE.length-1];
const col=id=>{const c=D.cats.find(x=>x.id===id);if(c)return c.col;return `var(--c-${BASE.some(b=>b.id===id)?id:"inne"})`};
const incOf=id=>INC.find(c=>c.id===id)||INC[INC.length-1];
const isInc=e=>e.typ==="wplyw";

function parts(e){
  const p=(e.czesci||[]).filter(x=>x.kwota>0),out={};
  p.forEach(x=>out[x.kat]=(out[x.kat]||0)+x.kwota);
  const rest=e.kwota-p.reduce((a,x)=>a+x.kwota,0);
  if(rest>0)out[e.kat]=(out[e.kat]||0)+rest;
  return Object.entries(out).map(([kat,kwota])=>({kat,kwota})).sort((a,b)=>b.kwota-a.kwota);
}
function subDate(s,k){const[,sm,sd]=s.start.split("-").map(Number);if(s.cykl==="r"&&Number(k.slice(5,7))!==sm)return null;return `${k}-${pad(Math.min(sd,daysIn(k)))}`}
function subsFor(k){const t=today();return D.subs.flatMap(s=>{const d=subDate(s,k);if(!d||d<s.start||d>t||(s.koniec&&d>s.koniec))return[];return[{id:`sub~${s.id}~${k}`,typ:"wydatek",kwota:s.kwota,kat:s.kat||"rozrywka",sklep:s.nazwa,data:d,sub:s.id,ts:0}]})}
function nextPay(s){const t=today();let k=ym(new Date());for(let i=0;i<14;i++){const d=subDate(s,k);if(d&&d>t&&d>=s.start)return s.koniec&&d>s.koniec?null:d;k=shiftMonth(k,1)}return null}
const subActive=s=>!s.koniec||s.koniec>=today();
const expOf=k=>[...D.items.filter(e=>!isInc(e)&&(e.data||"").startsWith(k)),...subsFor(k)];
const incIn=k=>D.items.filter(e=>isInc(e)&&(e.data||"").startsWith(k));
function accAt(id,date){
  const ms=D.mov.filter(m=>m.konto===id&&m.data<=date).sort((a,b)=>a.data.localeCompare(b.data)||(a.ts||0)-(b.ts||0));
  let dep=0,val=0,last=null;
  ms.forEach(m=>{if(m.rodzaj==="wplata"){dep+=m.kwota;val+=m.kwota}else if(m.rodzaj==="wyplata"){dep-=m.kwota;val-=m.kwota}else if(m.rodzaj==="wycena"){val=m.kwota;last=m}});
  return{dep,val,last};
}
function niceMax(v){if(v<=0)return 10000;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
const shopKey=s=>String(s||"").trim().toLowerCase();

function animateNumber(id,el,to){
  const from=S.shown[id]??0;S.shown[id]=to;
  const put=v=>{el.innerHTML=`${num.format(v/100)}<small>zł</small>`};
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||from===to){put(to);return}
  const t0=performance.now(),d=650;
  const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3);put(Math.round(from+(to-from)*e));if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

const TITLES={miesiac:"Mój Paragon",historia:"Historia",stale:"Stałe wydatki",inwestycje:"Inwestycje",ustawienia:"Ustawienia"};
function render(){
  $("#viewTitle").textContent=TITLES[S.view];
  document.querySelectorAll(".nav [data-v]").forEach(b=>{if(b.dataset.v===S.view)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const showMonth=S.view==="miesiac"||S.view==="historia";
  $("#monthbar").hidden=!showMonth;
  $("#monthName").textContent=monthLabel(S.month,{month:"long",year:"numeric"});
  $("#next").disabled=S.month>=ym(new Date());
  const m=$("#main");
  const html={miesiac:viewMonth,historia:viewHistory,stale:viewStale,inwestycje:viewInv,ustawienia:viewSettings}[S.view]();
  m.innerHTML=`<div class="view${S.animate?"":" still"}">${html}</div>`;
  if(!S.animate)m.querySelectorAll(".view>*").forEach(el=>el.style.animation="none");
  ({miesiac:afterMonth,historia:()=>{},stale:afterStale,inwestycje:afterInv,ustawienia:()=>{}})[S.view]();
  S.animate=false;
}

function viewMonth(){
  const k=S.month,list=expOf(k),total=sum(list),inc=sum(incIn(k)),now=new Date(),cur=k===ym(now),limit=D.budget.limit||0;
  let pace;
  if(!limit)pace=`<button class="link" data-go="stale">Ustaw miesięczny budżet</button>, a zobaczysz, ile możesz wydać dziennie.`;
  else if(total>limit)pace=`Budżet przekroczony o <b>${fmt(total-limit)}</b>.`;
  else if(cur){const left=limit-total,dl=daysIn(k)-now.getDate()+1;pace=`Zostało <b>${fmt(left)}</b>, czyli ok. <b>${fmt(Math.floor(left/dl))}</b> dziennie do końca miesiąca.`}
  else pace=`Zmieściło się w budżecie, zostało <b>${fmt(limit-total)}</b>.`;
  const mini=[];
  if(inc){const bal=inc-total;mini.push(`Wpływy <b>+${fmt(inc)}</b>`,`Bilans <b class="${bal<0?"neg":"pos"}">${signed(bal)}</b>`)}
  const subM=sum(list.filter(e=>e.sub));if(subM)mini.push(`Subskrypcje <b>${fmt(subM)}</b>`);
  const invM=sum(D.mov.filter(m=>m.rodzaj==="wplata"&&(m.data||"").startsWith(k)));if(invM)mini.push(`Na inwestycje <b>${fmt(invM)}</b>`);
  const p=limit?total/limit:0;
  const backupOld=D.items.length>=10&&(!D.lastBackup||(Date.now()-Date.parse(D.lastBackup))/864e5>30);
  let out=`<section class="receipt" id="receipt">
    <div class="r-label"><span>Wydane</span><span>${list.length} ${plural(list.length,"płatność","płatności","płatności")}</span></div>
    <div class="total" id="total"></div>
    ${limit?`<div class="bar"><i id="bar" data-w="${Math.min(100,p*100)}" style="background:${p>1?"var(--bad)":p>.85?"var(--warn)":"var(--accent)"}"></i></div>`:""}
    <div class="pace">${pace}</div>
    ${mini.length?`<div class="dash"></div><div class="mini">${mini.map(s=>`<span>${s}</span>`).join("")}</div>`:""}
  </section>`;
  if(backupOld)out+=`<div class="notice warn"><span>${D.lastBackup?`Ostatnia kopia zapasowa: ${shortDate(D.lastBackup.slice(0,10))}`:"Nie masz jeszcze kopii zapasowej."}</span><button class="btn ghost sm" data-act="backup">Zrób kopię</button></div>`;
  if(!list.length){
    out+=`<div class="card empty">${D.items.length||D.subs.length?"W tym miesiącu nie ma jeszcze wydatków.":"Tu zobaczysz, na co idą Twoje pieniądze."}<br>Dotknij <b>+</b> na dole, żeby dodać pierwszy wydatek.</div>`;
    return out;
  }
  out+=`<div class="card"><h2>Na co</h2><p class="sub" id="catSub"></p><div class="donut-row"><svg class="donut" id="donut" width="120" height="120" viewBox="0 0 120 120"></svg><ul class="cats" id="cats"></ul></div></div>`;
  out+=`<div class="card"><h2>Gdzie</h2><p class="sub">Ile zostawiasz w każdym sklepie i na co.</p><div class="shops" id="shops"></div></div>`;
  out+=`<div class="card"><h2>Tempo wydawania</h2><p class="sub" id="paceSub"></p><svg class="chart" id="cumChart" viewBox="0 0 340 160"></svg></div>`;
  out+=`<div class="card"><h2>Ostatnie miesiące</h2><p class="sub" id="monthsSub"></p><svg class="chart" id="monthsChart" viewBox="0 0 340 150"></svg></div>`;
  return out;
}

function afterMonth(){
  const k=S.month,list=expOf(k),total=sum(list);
  animateNumber("total",$("#total"),total);
  const bar=$("#bar");if(bar)requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width=bar.dataset.w+"%"));
  if(!list.length)return;
  const by={};list.flatMap(parts).forEach(x=>by[x.kat]=(by[x.kat]||0)+x.kwota);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  $("#catSub").textContent=`Najwięcej: ${catOf(rows[0][0]).n.toLowerCase()}, ${Math.round(rows[0][1]/total*100)}% wydatków.`;
  const R=46,C=2*Math.PI*R;let off=0,h=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--soft)" stroke-width="16"/>`;
  rows.forEach(([c,v])=>{const len=Math.max(0,v/total*C-(rows.length>1?2:0));h+=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${col(c)}" stroke-width="16" stroke-dasharray="0 ${C}" data-len="${len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=v/total*C});
  h+=`<text x="60" y="56" text-anchor="middle" style="font-size:9px;letter-spacing:.1em">KATEGORII</text><text x="60" y="76" text-anchor="middle" style="font-family:var(--f-display);font-size:22px;font-weight:700;fill:var(--ink)">${rows.length}</text>`;
  const dn=$("#donut");dn.innerHTML=h;
  requestAnimationFrame(()=>requestAnimationFrame(()=>dn.querySelectorAll("[data-len]").forEach(el=>el.setAttribute("stroke-dasharray",`${el.dataset.len} ${C}`))));
  const lim=D.budget.kat||{};
  $("#cats").innerHTML=rows.map(([c,v])=>{const L=lim[c]||0,p=L?v/L:0;return `<li><span class="dot" style="background:${col(c)}"></span><span class="name">${esc(catOf(c).n)}</span><span class="amt">${fmt(v)}</span>${L?`<span class="lim"><i style="width:${Math.min(100,p*100)}%;background:${p>1?"var(--bad)":p>.85?"var(--warn)":col(c)}"></i></span><span class="note">${p>1?`ponad limit o ${fmt(v-L)}`:`z ${fmt(L)}`}</span>`:""}</li>`}).join("");
  const shops={};
  list.forEach(e=>{const key=e.sub?"~sub":shopKey(e.sklep)||"~none";const s=shops[key]||(shops[key]={name:e.sub?"Subskrypcje":e.sklep?String(e.sklep).trim():"Bez nazwy sklepu",total:0,by:{},n:0});s.total+=e.kwota;s.n++;parts(e).forEach(x=>s.by[x.kat]=(s.by[x.kat]||0)+x.kwota)});
  const sl=Object.values(shops).sort((a,b)=>b.total-a.total);
  const top=sl.slice(0,6),rest=sl.slice(6);
  if(rest.length){const o={name:`Pozostałe (${rest.length})`,total:0,by:{},n:0};rest.forEach(s=>{o.total+=s.total;o.n+=s.n;Object.entries(s.by).forEach(([c,v])=>o.by[c]=(o.by[c]||0)+v)});top.push(o)}
  $("#shops").innerHTML=top.map(s=>{const cs=Object.entries(s.by).sort((a,b)=>b[1]-a[1]);

function renderCum(list){
  const k=S.month,D_=daysIn(k),now=new Date(),cur=k===ym(now),last=cur?now.getDate():D_;
  const daily=Array(D_+1).fill(0);list.forEach(e=>{daily[Number(e.data.slice(8,10))]+=e.kwota});
  const cum=[0];for(let d=1;d<=D_;d++)cum[d]=cum[d-1]+daily[d];
  const limit=D.budget.limit||0,W=340,H=160,l=44,r=10,t=12,b=24,max=niceMax(Math.max(cum[last],limit)*1.05);
  const x=d=>l+(d/D_)*(W-l-r),y=v=>t+(1-v/max)*(H-t-b);
  let s="";
  [0,.5,1].forEach(f=>{const v=max*f;s+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${y(v)+3}" text-anchor="end">${compact.format(v/100)}</text>`});
  [1,8,15,22,D_].forEach(d=>{s+=`<text x="${x(d)}" y="${H-6}" text-anchor="middle">${d}</text>`});
  if(limit)s+=`<line x1="${x(0)}" y1="${y(0)}" x2="${x(D_)}" y2="${y(limit)}" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="${x(D_)}" y="${y(limit)-6}" text-anchor="end">budżet</text>`;
  const pts=[];for(let d=0;d<=last;d++)pts.push(`${x(d).toFixed(1)},${y(cum[d]).toFixed(1)}`);
  s+=`<defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><polygon points="${x(0)},${y(0)} ${pts.join(" ")} ${x(last)},${y(0)}" fill="url(#ga)"/><polyline id="cumLine" points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><circle cx="${x(last)}" cy="${y(cum[last])}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  $("#cumChart").innerHTML=s;drawLine("#cumLine");
  let sub="Suma wydatków dzień po dniu.";
  if(limit&&cur){const diff=cum[last]-limit*last/D_;sub=diff>0?`Wydajesz szybciej, niż zakłada budżet, o ${fmt(diff)} ponad plan na dziś.`:`Jesteś ${fmt(-diff)} poniżej planu na dziś.`}
  $("#paceSub").textContent=sub;
}
function drawLine(sel){const pl=$(sel);if(!pl)return;if(matchMedia("(prefers-reduced-motion: reduce)").matches){pl.removeAttribute("stroke-dasharray");return}pl.style.transition="stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)";requestAnimationFrame(()=>requestAnimationFrame(()=>pl.setAttribute("stroke-dashoffset","0")))}

function renderMonths(){
  const ks=[];for(let i=5;i>=0;i--)ks.push(shiftMonth(S.month,-i));
  const vals=ks.map(k=>sum(expOf(k))),incs=ks.map(k=>sum(incIn(k)));
  const W=340,H=150,t=18,b=22,max=niceMax(Math.max(...vals,...incs,1)),bw=(W-20)/6;
  let s=`<line x1="0" x2="${W}" y1="${H-b}" y2="${H-b}" stroke="var(--line)"/>`;
  ks.forEach((k,i)=>{const v=vals[i],h=(v/max)*(H-t-b),hi=(incs[i]/max)*(H-t-b),x=10+i*bw+bw*.2,w=bw*.6,last=i===5,hh=Math.max(h,v?2:0);
    if(incs[i])s+=`<rect x="${x-3}" y="${H-b-hi}" width="${w+6}" height="${hi}" rx="6" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
    s+=`<rect x="${x}" y="${H-b-hh}" width="${w}" height="${hh}" rx="4" fill="var(--accent)" fill-opacity="${last?1:.32}"><animate attributeName="height" from="0" to="${hh}" dur=".6s" fill="freeze"/><animate attributeName="y" from="${H-b}" to="${H-b-hh}" dur=".6s" fill="freeze"/></rect>`;
    if(v)s+=`<text x="${x+w/2}" y="${H-b-Math.max(h,hi)-5}" text-anchor="middle" style="${last?"fill:var(--ink);font-weight:600":""}">${compact.format(v/100)}</text>`;
    s+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${monthLabel(k,{month:"short"})}</text>`});
  $("#monthsChart").innerHTML=s;

const nameKey=n=>String(n||"").toUpperCase().replace(/[^A-ZĄĆĘŁŃÓŚŹŻ ]/g," ").replace(/\b(L|ML|G|KG|SZT|X|A|B|C|D)\b/g," ").replace(/\s+/g," ").trim().slice(0,32);
function guessCat(n){const k=nameKey(n);if(k&&D.learn&&D.learn[k]&&cats().some(c=>c.id===D.learn[k]))return D.learn[k];const u=String(n).toUpperCase();for(const[c,re]of RULES)if(re.test(u))return c;return "jedzenie"}
const P=s=>Math.round(parseFloat(String(s).replace(/[Oo]/g,"0").replace(",","."))*100);
function parseReceipt(text){
  const raw=text.split(/\r?\n/).map(l=>l.replace(/[|_]/g," ").replace(/\s+/g," ").trim()).filter(Boolean);
  const up=text.toUpperCase();
  const shop=(SHOPS.find(([k])=>new RegExp(`(^|[^A-ZĄĆĘŁŃÓŚŹŻ])${k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}([^A-ZĄĆĘŁŃÓŚŹŻ]|$)`).test(up))||[])[1]||"";
  let date="";const d1=text.match(/(20\d{2})[-.\/](\d{2})[-.\/](\d{2})/),d2=text.match(/\b(\d{2})[-.\/](\d{2})[-.\/](20\d{2})\b/);
  if(d1)date=`${d1[1]}-${d1[2]}-${d1[3]}`;else if(d2)date=`${d2[3]}-${d2[2]}-${d2[1]}`;
  let total=0;const sm=text.match(/SUMA\s*(?:PLN)?\s*[:.]?\s*(\d+[.,]\s?\d{2})/i);if(sm)total=P(sm[1].replace(/\s/g,""));
  let start=raw.findIndex(l=>/PARAGON\s*FISKALNY/i.test(l));start=start<0?0:start+1;
  const STOP=/SPRZEDA[ŻZ]|SUMA|PTU|OPODATK|RAZEM|DO ZAP[ŁL]ATY/i;
  const SKIP=/NIP|PARAGON|UL\.|TEL\.|^\d{2}[-.]\d{2}|KASA|KASJER|NR SYS|^#|WWW\./i;
  const PRICE=/(-?\d+[.,]\d{2})\s*[A-GŁ]?\s*\*?$/;
  const QTY=/(\d+(?:[.,]\d+)?)\s*(?:szt\.?|kg|op\.?)?\s*[x×*]\s*(\d+[.,]\d{2})/i;
  const items=[];let pend="";
  for(let i=start;i<raw.length;i++){
    const l=raw[i];
    if(STOP.test(l))break;
    const pm=l.match(PRICE);
    if(/RABAT|OPUST|PROMOCJ|ZNI[ŻZ]K|UPUST/i.test(l)){if(pm&&items.length){const v=Math.abs(P(pm[1]));items[items.length-1].kwota=Math.max(0,items[items.length-1].kwota-v)}pend="";continue}
    if(!pm){if(!SKIP.test(l)&&/[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]{3}/.test(l))pend=l;continue}
    let name=l.slice(0,pm.index).replace(QTY,"").replace(/\s+\d+([.,]\d+)?\s*$/,"").trim();
    if(!/[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]{2}/.test(name)){if(pend){name=pend}else continue}

}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function prepImage(file){
  const bmp=await createImageBitmap(file),sc=Math.min(1,2200/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
  c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);const x=c.getContext("2d");x.filter="grayscale(1) contrast(1.5)";x.drawImage(bmp,0,0,c.width,c.height);return c;
}
async function ocr(file,onp){
  if(!window.Tesseract)await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js");

  const w=await Tesseract.createWorker("pol",1,{logger:m=>{if(m.status==="recognizing text")onp(m.progress)}});

function shake(sel){const el=$(sel);el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}

document.querySelector(".nav").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)go(b.dataset.v)});
$("#gear").onclick=()=>go(S.view==="ustawienia"?"miesiac":"ustawienia");
function go(v){S.view=v;S.open=null;S.confirm=null;S.animate=true;render();window.scrollTo({top:0,behavior:"smooth"})}
$("#prev").onclick=()=>{S.month=shiftMonth(S.month,-1);S.open=null;S.animate=true;render()};
$("#next").onclick=()=>{S.month=shiftMonth(S.month,1);S.open=null;S.animate=true;render()};

$("#main").addEventListener("click",e=>{
  const t=e.target;
  const g=t.closest("[data-go]");if(g){go(g.dataset.go);return}
  const act=t.closest("[data-act]");
  if(act){const a=act.dataset.act;
    if(a==="backup")return exportData();
    if(a==="import")return $("#importFile").click();
    if(a==="importok"){D={...EMPTY(),...S.pendingImport};delete D.exported;S.pendingImport=null;save();S.shown={};toast("Wczytano kopię");return go("miesiac")}
    if(a==="importno"){S.pendingImport=null;return render()}
    if(a==="wipe"){if(S.confirm!=="wipe"){S.confirm="wipe";return render()}D=EMPTY();save();S.confirm=null;S.shown={};toast("Usunięto wszystkie dane");return go("miesiac")}
    if(a==="savebudget"){const kat={};cats().forEach(c=>{const el=$("#b-"+c.id);const v=el?parseG(el.value):0;if(v)kat[c.id]=v});D.budget={limit:parseG($("#b-total").value),kat};save();toast("Zapisano budżet");return go("miesiac")}
    if(a==="subform"){$("#subForm").hidden=false;act.hidden=true;$("#s-start").value=today();$("#s-name").focus();return}
    if(a==="subcancel"){$("#subForm").hidden=true;$("#addSubBtn").hidden=false;return}
    if(a==="accform"){$("#accForm").hidden=false;act.hidden=true;$("#a-name").focus();return}
    if(a==="acccancel"){$("#accForm").hidden=true;$("#addAccBtn").hidden=false;return}
    if(a==="delacc"){if(!S.confirmAcc){S.confirmAcc=true;return render()}const id=S.openAcc;D.mov=D.mov.filter(m=>m.konto!==id);D.acc=D.acc.filter(x=>x.id!==id);S.openAcc=null;S.confirmAcc=false;save();toast("Usunięto konto");return render()}
  }
  const q=t.closest("[data-q]");if(q){$("#s-name").value=q.dataset.q;$("#s-cat").value=/iCloud|Google One/.test(q.dataset.q)?"inne":"rozrywka";document.querySelectorAll("[data-q]").forEach(c=>c.setAttribute("aria-pressed",c===q));$("#s-amt").focus();return}
  const ed=t.closest("[data-edit]");if(ed){const it=D.items.find(x=>x.id===ed.dataset.edit);if(it)openSheet(it);return}
  const del=t.closest("[data-del]");if(del){const id=del.dataset.del;if(S.confirm!==id){S.confirm=id;return render()}D.items=D.items.filter(x=>x.id!==id);save();S.confirm=null;S.open=null;toast("Usunięto");return render()}
  const df=t.closest("[data-delfav]");if(df){const id=df.dataset.delfav;if(S.confirm!=="fav"+id){S.confirm="fav"+id;return render()}D.fav=(D.fav||[]).filter(f=>f.id!==id);save();S.confirm=null;toast("Usunięto z ulubionych");return render()}
  const dc=t.closest("[data-delcat]");if(dc){const id=dc.dataset.delcat;if(S.confirm!=="cat"+id){S.confirm="cat"+id;return render()}D.cats=D.cats.filter(c=>c.id!==id);D.items.forEach(it=>{if(it.kat===id)it.kat="inne";(it.czesci||[]).forEach(p=>{if(p.kat===id)p.kat="inne"});(it.pozycje||[]).forEach(p=>{if(p.kat===id)p.kat="inne"})});(D.fav||[]).forEach(f=>{if(f.kat===id)f.kat="inne"});Object.keys(D.learn||{}).forEach(k=>{if(D.learn[k]===id)delete D.learn[k]});D.subs.forEach(s=>{if(s.kat===id)s.kat="inne"});if(D.budget.kat)delete D.budget.kat[id];save();S.confirm=null;toast("Usunięto kategorię");return render()}
  const se=t.closest("[data-subend]");if(se){if(S.confirmSub!=="end"){S.confirmSub="end";return render()}const s=D.subs.find(x=>x.id===se.dataset.subend);if(s)s.koniec=today();save();S.confirmSub=null;S.openSub=null;toast("Subskrypcja zakończona");return render()}
  const sd=t.closest("[data-subdel]");if(sd){if(S.confirmSub!=="del"){S.confirmSub="del";return render()}D.subs=D.subs.filter(x=>x.id!==sd.dataset.subdel);save();S.confirmSub=null;S.openSub=null;toast("Usunięto subskrypcję");return render()}
  const sr=t.closest("[data-sub]");if(sr){S.openSub=S.openSub===sr.dataset.sub?null:sr.dataset.sub;S.confirmSub=null;return render()}
  const mr=t.closest("[data-r]");if(mr){S.movR=mr.dataset.r;const amt=$("#m-amt").value,d=$("#m-date").value;render();$("#m-amt").value=amt;$("#m-date").value=d;return}
  const dm=t.closest("[data-delmov]");if(dm){const id=dm.dataset.delmov;if(S.confirmMov!==id){S.confirmMov=id;return render()}D.mov=D.mov.filter(m=>m.id!==id);save();S.confirmMov=null;toast("Usunięto wpis");return render()}
  if(t.closest("#movForm"))return;
  const ac=t.closest("[data-acc]");if(ac){S.openAcc=S.openAcc===ac.dataset.acc?null:ac.dataset.acc;S.movR="wplata";S.confirmMov=null;S.confirmAcc=false;return render()}
  const row=t.closest("[data-row]");if(row&&!t.closest(".x .btns")){S.open=S.open===row.dataset.row?null:row.dataset.row;S.confirm=null;return render()}
});

$("#main").addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="subForm"){const name=$("#s-name").value.trim(),g=parseG($("#s-amt").value);if(!name){$("#s-name").focus();return toast("Wpisz nazwę")}if(!g){$("#s-amt").focus();return toast("Wpisz kwotę")}
    D.subs.push({id:uid(),nazwa:name.slice(0,40),kwota:g,cykl:$("#s-cycle").value,start:$("#s-start").value||today(),koniec:null,kat:$("#s-cat").value,ts:Date.now()});save();toast(`Dodano ${name}`);S.animate=true;return render()}
  if(f.id==="accForm"){const name=$("#a-name").value.trim();if(!name){$("#a-name").focus();return toast("Wpisz nazwę konta")}
    const id=uid(),dep=parseG($("#a-dep").value),val=parseG($("#a-val").value),d=$("#a-date").value||today(),now=Date.now();
    D.acc.push({id,nazwa:name.slice(0,40),typ:$("#a-type").value,ts:now});
    if(dep)D.mov.push({id:uid(),konto:id,rodzaj:"wplata",kwota:dep,data:d,ts:now+1});
    if(val)D.mov.push({id:uid(),konto:id,rodzaj:"wycena",kwota:val,data:today()>d?today():d,ts:now+2});
    save();S.openAcc=id;S.animate=true;toast("Dodano konto");return render()}
  if(f.id==="movForm"){const g=parseG($("#m-amt").value);if(!g){$("#m-amt").focus();return toast("Wpisz kwotę")}
    D.mov.push({id:uid(),konto:S.openAcc,rodzaj:S.movR,kwota:g,data:$("#m-date").value||today(),ts:Date.now()});save();S.confirmMov=null;S.animate=true;render();return toast(S.movR==="wycena"?"Zapisano wartość":S.movR==="wyplata"?"Zapisano wypłatę":`Dodano wpłatę ${fmt(g)}`)}
  if(f.id==="favForm"){const n=$("#v-name").value.trim().slice(0,24);if(!n){$("#v-name").focus();return toast("Wpisz nazwę")}
    D.fav=D.fav||[];D.fav.push({id:uid(),n,kat:$("#v-cat").value,kwota:parseG($("#v-amt").value)});save();toast(`Dodano do ulubionych: ${n}`);return render()}
  if(f.id==="catForm"){const n=$("#c-name").value.trim().slice(0,28);if(!n){$("#c-name").focus();return}if(cats().some(c=>c.n.toLowerCase()===n.toLowerCase()))return toast("Taka kategoria już jest");
    D.cats.push({id:"u_"+uid(),n,col:PAL[D.cats.length%PAL.length]});save();toast(`Dodano kategorię ${n}`);return render()}
});

async function exportData(){
  const stamp=new Date().toISOString(),json=JSON.stringify({...D,exported:stamp});
  const name=`moj-paragon-kopia-${today()}.json`;
  const file=new File([json],name,{type:"application/json"});
  let done=false;
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Mój Paragon – kopia"});done=true}}catch(e){if(e&&e.name==="AbortError")return}
  if(!done){const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
  D.lastBackup=stamp;save();toast("Kopia gotowa");render();
}
$("#importFile").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const d=JSON.parse(await f.text());if(!d||d.v!==1||!Array.isArray(d.items))throw 0;S.pendingImport={...EMPTY(),...d};go("ustawienia")}
  catch(err){toast("To nie jest plik kopii z tej aplikacji")}
});

let tT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("on"),2000)}

window.addEventListener("storage",e=>{if(e.key===STORE){D=load();render()}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script>
